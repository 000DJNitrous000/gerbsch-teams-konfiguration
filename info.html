<body><main><h1>Räder-Wareneingang</h1><p>Interne Vorbereitung für die Prüfung von Reifenlieferungen. Der Bildabgleich ist erst aktiv, wenn der Zugriff eingerichtet und erfolgreich getestet wurde.</p><p>Unklare Lieferungen müssen weiterhin persönlich geprüft werden.</p></main></body></html>
